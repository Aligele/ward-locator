<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ward Locator</title>
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
html, body { margin: 0; }

  /* Layout: controls on top, result card, then a scaled schematic map with a numbered ward key. */
  :root {
    --bg: #f6f7f4;
    --surface: #ffffff;
    --fg: #1b2a22;
    --muted: #5f6d65;
    --line: #dde3dc;
    --accent: #0b6e4f;
    --accent-ink: #ffffff;
    --route: #c2410c;
    --me: #1d4ed8;
    --grid: #e6ebe4;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1713; --surface: #17211b; --fg: #e6efe9; --muted: #98a89f; --line: #28372e;
      --accent: #3ecf9a; --accent-ink: #06231a; --route: #fb923c; --me: #7aa2ff; --grid: #1d2a22;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1713; --surface: #17211b; --fg: #e6efe9; --muted: #98a89f; --line: #28372e;
    --accent: #3ecf9a; --accent-ink: #06231a; --route: #fb923c; --me: #7aa2ff; --grid: #1d2a22;
    color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px;
    padding-block: 16px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 22px; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 460px) { .controls { grid-template-columns: 1fr; } }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted);
    letter-spacing: .04em; text-transform: uppercase; min-width: 0; }
  select { font: inherit; font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; }
  select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .arrow { display: inline-block; transition: transform .3s; color: var(--route); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn { display: inline-block; font: inherit; font-size: 15px; padding: 10px 14px; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); text-decoration: none; cursor: pointer; }
  .btn.alt { background: transparent; color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .mapbox { padding: 8px; }
  svg { display: block; width: 100%; height: auto; max-height: 76vh; }
  .key { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin: 0; padding: 0; list-style: none; }
  .key button { width: 100%; text-align: left; font: inherit; font-size: 14px; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .key button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .key i { font-style: normal; font-weight: 600; width: 22px; height: 22px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; }
  .key .hd { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .key small { color: var(--muted); display: block; font-size: 11px; }
  .stations h2 { font-size: 16px; margin: 0 0 2px; }
  .stations .meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .st { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .st li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--line); }
  .st li:first-child { border-top: 0; }
  .st .nm { font-weight: 600; overflow-wrap: anywhere; }
  .st .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .st a { font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--accent); color: var(--accent);
    text-decoration: none; white-space: nowrap; }
  .pairnote { font-size: 13px; padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; background: color-mix(in srgb, var(--route) 12%, transparent); color: var(--fg); }
  .st a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<div class="wrap">
  <div>
    <h1>Ward Locator</h1>
    <div class="sub">27 survey wards in Uasin Gishu, Nandi, West Pokot and Baringo. Pick a ward to see how far it is and which way to go.</div>
  </div>

  <div class="controls">
    <label>Go to
      <select id="to" aria-label="Ward to visit"></select>
    </label>
    <label>Starting from
      <select id="from" aria-label="Starting point"></select>
    </label>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b id="dist">--</b><span>Straight line</span></div>
      <div class="stat"><b id="road">--</b><span>By road (estimate)</span></div>
      <div class="stat"><b><span class="arrow" id="arrow">&#8593;</span> <span id="dir">--</span></b><span>Head this way</span></div>
    </div>
    <div class="actions">
      <a class="btn" id="navMe" target="_blank" rel="noopener">Directions from my location</a>
      <a class="btn alt" id="navFrom" target="_blank" rel="noopener">Directions from start</a>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="card mapbox">
    <svg id="map" viewBox="0 0 360 560" role="img" aria-label="Map of the survey wards"></svg>
  </div>

  <div class="card stations">
    <h2 id="stTitle">Polling stations</h2>
    <div class="meta" id="stMeta"></div>
    <ul class="st" id="stList"></ul>
  </div>

  <ul class="key" id="key"></ul>
</div>

function el(tag, attrs, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
const rad = d => d * Math.PI / 180;
function km(a, b, c, d){
  const dl = rad(c - a), dg = rad(d - b);
  const x = Math.sin(dl/2)**2 + Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(dg/2)**2;
  return 12742 * Math.asin(Math.sqrt(x));
}
function bearing(a, b, c, d){
  const y = Math.sin(rad(d - b)) * Math.cos(rad(c));
  const x = Math.cos(rad(a)) * Math.sin(rad(c)) - Math.sin(rad(a)) * Math.cos(rad(c)) * Math.cos(rad(d - b));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function drawMap(dest, start){
  const svg = $('map');
  svg.textContent = '';
  const W = 360, pad = 34;
  // fit the view to the selected ward's county plus the starting point
  const pts = WARDS.filter(w => w.county === dest.county).map(w => [w.lat, w.lng]);
  pts.push([start.lat, start.lng]);
  const lats = pts.map(p => p[0]), lngs = pts.map(p => p[1]);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const spanLat = maxLat - minLat, spanLng = maxLng - minLng;
  const sc = Math.min((W - 2 * pad) / Math.max(spanLng, 0.15), 500 / Math.max(spanLat, 0.15));
  const H = Math.max(260, Math.round(spanLat * sc + 2 * pad));
  const offX = (W - 2 * pad - spanLng * sc) / 2, offY = (H - 2 * pad - spanLat * sc) / 2;
  const px = lng => pad + offX + (lng - minLng) * sc;
  const py = lat => pad + offY + (maxLat - lat) * sc;
  const inView = (x, y) => x > -6 && x < W + 6 && y > -6 && y < H + 6;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.appendChild(el('rect', {x:0, y:0, width:W, height:H, rx:8, fill:'var(--bg)'}));
  // grid
  const step = [0.05, 0.1, 0.2, 0.5, 1].find(s => s * sc >= 45) || 1;
  for (let lat = Math.floor((minLat - 2) / step) * step; lat <= maxLat + 2; lat += step){
    const y = py(lat); if (y < 0 || y > H) continue;
    svg.appendChild(el('line', {x1:0, x2:W, y1:y, y2:y, stroke:'var(--grid)', 'stroke-width':1}));
  }
  for (let lng = Math.floor((minLng - 2) / step) * step; lng <= maxLng + 2; lng += step){
    const x = px(lng); if (x < 0 || x > W) continue;
    svg.appendChild(el('line', {y1:0, y2:H, x1:x, x2:x, stroke:'var(--grid)', 'stroke-width':1}));
  }
  // county name and north arrow
  svg.appendChild(el('text', {x:12, y:20, fill:'var(--muted)', 'font-size':11, 'letter-spacing':1}, dest.county.toUpperCase()));
  svg.appendChild(el('path', {d:'M' + (W - 24) + ' 34 L' + (W - 18) + ' 48 L' + (W - 24) + ' 44 L' + (W - 30) + ' 48 Z', fill:'var(--fg)'}));
  svg.appendChild(el('text', {x:W - 24, y:24, 'text-anchor':'middle', fill:'var(--muted)', 'font-size':11}, 'N'));
  // scale bar
  const barKm = [1, 2, 5, 10, 20, 50, 100].find(k => k / 111.32 * sc >= 40) || 100;
  const barPx = barKm / 111.32 * sc;
  svg.appendChild(el('line', {x1:14, x2:14 + barPx, y1:H - 14, y2:H - 14, stroke:'var(--fg)', 'stroke-width':2}));
  svg.appendChild(el('text', {x:14, y:H - 20, fill:'var(--muted)', 'font-size':10}, barKm + ' km'));
  // survey GPS zone of the selected ward, to scale
  svg.appendChild(el('circle', {cx:px(dest.lng), cy:py(dest.lat), r:dest.r / 1000 / 111.32 * sc, fill:'var(--route)', 'fill-opacity':0.08, stroke:'var(--route)', 'stroke-opacity':0.5, 'stroke-dasharray':'3 4'}));
  // route
  if (start && !(start.lat === dest.lat && start.lng === dest.lng)){
    const x1 = px(start.lng), y1 = py(start.lat), x2 = px(dest.lng), y2 = py(dest.lat);
    svg.appendChild(el('line', {x1, y1, x2, y2, stroke:'var(--route)', 'stroke-width':2.5, 'stroke-dasharray':'6 5'}));
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const ax = x2 - Math.cos(ang) * 14, ay = y2 - Math.sin(ang) * 14;
    const p1 = [ax - Math.sin(ang) * 5, ay + Math.cos(ang) * 5], p2 = [ax + Math.sin(ang) * 5, ay - Math.cos(ang) * 5];
    svg.appendChild(el('polygon', {points:[[x2 - Math.cos(ang) * 10, y2 - Math.sin(ang) * 10], p1, p2].map(p => p.join(',')).join(' '), fill:'var(--route)'}));
  }
  // Eldoret town
  const tx = px(TOWN.lng), ty = py(TOWN.lat);
  if (inView(tx, ty)){
    svg.appendChild(el('path', {d:'M' + tx + ' ' + (ty - 5) + ' L' + (tx + 5) + ' ' + ty + ' L' + tx + ' ' + (ty + 5) + ' L' + (tx - 5) + ' ' + ty + ' Z', fill:'var(--me)'}));
    svg.appendChild(el('text', {x:tx + 8, y:ty + 16, fill:'var(--me)', 'font-size':10}, 'Eldoret'));
  }
  // wards
  WARDS.forEach(w => {
    const x = px(w.lng), y = py(w.lat);
    if (!inView(x, y)) return;
    const g = el('g', {style:'cursor:pointer', tabindex:0, role:'button', 'aria-label':w.name});
    const on = dest.n === w.n;
    g.appendChild(el('circle', {cx:x, cy:y, r:on ? 11 : 9, fill:on ? 'var(--route)' : 'var(--accent)', stroke:'var(--surface)', 'stroke-width':2}));
    g.appendChild(el('text', {x:x, y:y + 4, 'text-anchor':'middle', fill:'#fff', 'font-size':on ? 11 : 10, 'font-weight':700}, String(w.n)));
    g.addEventListener('click', () => { toSel.value = String(w.n); render(); });
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toSel.value = String(w.n); render(); } });
    svg.appendChild(g);
  });
  // destination label
  const lx = px(dest.lng), ly = py(dest.lat);
  const left = lx > W * 0.6;
  svg.appendChild(el('text', {x:left ? lx - 16 : lx + 16, y:ly + 4, 'text-anchor':left ? 'end' : 'start', fill:'var(--fg)', 'font-size':12, 'font-weight':600}, dest.name));
}

function renderStations(dest){
  const list = STATIONS[String(dest.n)] || [];
  $('stTitle').textContent = 'Polling stations in ' + dest.name;
  $('stMeta').textContent = list.length + ' stations, 20 interviews each (10 near the station, 10 at the nearest trading centre). Dates and teams are from the field plan.';
  const old = document.getElementById('pairNote'); if (old) old.remove();
  if (dest.pair){
    const n = document.createElement('div'); n.id = 'pairNote'; n.className = 'pairnote';
    n.textContent = 'High-risk ward: work in pairs with a local guide, 2 stations a day, and be back by 17:00.';
    $('stMeta').after(n);
  }
  const ul = $('stList');
  ul.textContent = '';
  list.forEach(s => {
    const li = document.createElement('li');
    const left = document.createElement('div');
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = s.name;
    const sub = document.createElement('div'); sub.className = 'sub';
    sub.textContent = s.date + ' \u00b7 ' + s.who + ' \u00b7 ' + s.code;
    left.append(nm, sub);
    const a = document.createElement('a');
    a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Find on map';
    a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.name + ', ' + dest.name + ', ' + dest.county + ', Kenya');
    a.setAttribute('aria-label', 'Find ' + s.name + ' on Google Maps');
    li.append(left, a);
    ul.appendChild(li);
  });
}

function render(){
  const dest = WARDS.find(w => String(w.n) === toSel.value);
  const start = startPoint();
  document.querySelectorAll('.key button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.n === String(dest.n))));
  const d = km(start.lat, start.lng, dest.lat, dest.lng);
  const sameSpot = d < 0.05;
  if (sameSpot){
    $('dist').textContent = '0 km'; $('road').textContent = '0 km'; $('dir').textContent = '--';
    $('arrow').style.transform = 'none';
    $('hint').textContent = 'The start and the ward share a centre point.';
  } else {
    const b = bearing(start.lat, start.lng, dest.lat, dest.lng);
    $('dist').textContent = d.toFixed(1) + ' km';
    $('road').textContent = '~' + Math.round(d * 1.3) + ' km';
    $('dir').textContent = compass(b) + ' ' + Math.round(b) + '°';
    $('arrow').style.transform = 'rotate(' + b + 'deg)';
    $('hint').textContent = 'Road distance is about 1.3 times the straight line, so check it in Google Maps. The ward centre is the ward’s middle point, not a specific building. Survey GPS zone: within ' + (dest.r / 1000).toFixed(1) + ' km of it.';
  }
  const dst = dest.lat + ',' + dest.lng;
  $('navMe').href = 'https://www.google.com/maps/dir/?api=1&destination=' + dst + '&travelmode=driving';
  $('navFrom').href = 'https://www.google.com/maps/dir/?api=1&origin=' + start.lat + ',' + start.lng + '&destination=' + dst + '&travelmode=driving';
  $('navFrom').textContent = 'Directions from ' + (fromSel.value === 'T' ? 'Eldoret town' : start.name);
  drawMap(dest, start);
  renderStations(dest);
}
toSel.addEventListener('change', render);
fromSel.addEventListener('change', render);
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
